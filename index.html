
<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Monitor de Precios de la Luz (España)</title>
    <meta name="color-scheme" content="light dark" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>

    <style>
      html,body{height:100%} .tabular-nums{font-variant-numeric:tabular-nums}
    </style>

    <!-- React 18 UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Recharts UMD -->
    <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
    <!-- FileSaver para CSV -->
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <!-- Babel para transformar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-gradient-to-b from-white to-zinc-50 dark:from-zinc-950 dark:to-zinc-900 text-zinc-900 dark:text-zinc-100 min-h-screen">
    <div id="root"></div>

    <!-- Tu app en JSX (Babel la compila al vuelo) -->
    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;
      const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, ReferenceArea } = Recharts;

      const TZ = "Europe/Madrid";
      const fmtHour = (d)=> new Intl.DateTimeFormat("es-ES",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
      const yyyy_mm_dd = (d)=> new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);

      function generateDemoSeries(base=new Date()){
        const d=new Date(base); d.setHours(0,0,0,0); const out=[]; const baseP=70;
        for(let h=0;h<24;h++){ const t=new Date(d.getTime()+h*3600*1000);
          const wave=20*Math.sin(((h-7)/24)*Math.PI*2)+15*Math.sin(((h+2)/24)*Math.PI*4);
          const noise=(Math.random()-0.5)*6;
          out.push({ datetime:t.toISOString(), price: Math.max(10, Math.round((baseP+wave+noise)*10)/10) });
        } return out;
      }

      function toCSV(rows){
        const header=["datetime","hour_local","price_eur_mwh","price_eur_kwh"];
        const fmt=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false});
        const body=rows.map(r=>[r.datetime, fmt.format(new Date(r.datetime)), r.price, (r.price/1000).toFixed(5)].join(",")).join("\n");
        return [header.join(","), body].join("\n");
      }

      const statsOf=(rows)=>{ if(!rows?.length) return null;
        const p=rows.map(r=>r.price); const avg=p.reduce((a,b)=>a+b,0)/p.length;
        const min=Math.min(...p), max=Math.max(...p), iMin=p.indexOf(min), iMax=p.indexOf(max);
        return {avg,min,max,iMin,iMax};
      };

      const currentHourIndex=(rows)=>{ if(!rows?.length) return -1;
        const now=new Date(); const today=yyyy_mm_dd(now);
        return rows.findIndex(r=>{ const dt=new Date(r.datetime); return yyyy_mm_dd(dt)===today && dt.getHours()===now.getHours(); });
      };

      async function fetchFromCustomURL(url){
        const res=await fetch(url); if(!res.ok) throw new Error("No se pudo obtener datos de la URL personalizada");
        const data=await res.json(); if(!Array.isArray(data)) throw new Error("El JSON debe ser un array de objetos { datetime, price }");
        return data.map(d=>({ datetime:d.datetime, price:Number(d.price) }));
      }

      async function fetchFromESIOS({ token, date, geoIds=["8741"], dataset=600 }){
        const url=`https://api.esios.ree.es/indicators/${dataset}?start_date=${date}T00:00:00&end_date=${date}T23:59:59&geos[]=${geoIds.join("&geos[]=")}`;
        const res=await fetch(url,{ headers:{ Accept:"application/json; application/vnd.esios-api-v2+json", Authorization:\`Token token=\${token}\` }});
        if(!res.ok) throw new Error("ESIOS: error de red o credenciales");
        const json=await res.json(); const values=json?.indicator?.values||[];
        return values.map(v=>({ datetime:v.datetime, price:Number(v.value) }));
      }

      function PriceTooltip({ active, payload }) {
        if (!active || !payload?.length) return null;
        const p = payload[0].payload, dt=new Date(p.datetime), hour=fmtHour(dt);
        return (
          <div className="rounded-2xl border bg-white/90 dark:bg-zinc-900/90 px-3 py-2 text-sm shadow-lg">
            <div className="font-medium">{hour} h</div>
            <div className="opacity-80">{p.price.toFixed(1)} €/MWh</div>
            <div className="opacity-80">{(p.price/1000).toFixed(5)} €/kWh</div>
          </div>
        );
      }

      function App(){
        const [date,setDate]=useState(()=>yyyy_mm_dd(new Date()));
        const [mode,setMode]=useState("demo"); // demo | custom | esios
        const [customURL,setCustomURL]=useState("");
        const [esiosToken,setEsiosToken]=useState("");
        const [esiosDataset,setEsiosDataset]=useState("600");
        const [esiosGeo,setEsiosGeo]=useState("8741");
        const [rows,setRows]=useState(()=>generateDemoSeries());
        const [loading,setLoading]=useState(false);
        const [error,setError]=useState("");
        const [dailyKWh,setDailyKWh]=useState(5);
        const [hourlyProfile,setHourlyProfile]=useState(()=>new Array(24).fill(0).map((_,i)=> i>=19&&i<=23 ? 0.35 : 0.65/19));

        const stats = React.useMemo(()=>statsOf(rows),[rows]);
        const nowIdx = React.useMemo(()=>currentHourIndex(rows),[rows]);

        React.useEffect(()=>{ (async ()=>{
          setError(""); setLoading(true);
          try{
            if(mode==="demo"){ setRows(generateDemoSeries(new Date(date+"T00:00:00"))); }
            else if(mode==="custom" && customURL){ setRows(await fetchFromCustomURL(customURL)); }
            else if(mode==="esios" && esiosToken){
              setRows(await fetchFromESIOS({ token:esiosToken, date, geoIds: esiosGeo.split(",").map(s=>s.trim()), dataset:Number(esiosDataset) }));
            } else { setRows(generateDemoSeries(new Date(date+"T00:00:00"))); }
          }catch(e){ console.error(e); setError(e?.message||"Error al cargar datos"); }
          finally{ setLoading(false); }
        })(); },[mode,customURL,esiosToken,esiosDataset,esiosGeo,date]);

        const cheapHours = useMemo(()=> !rows?.length?[]:
          [...rows].map((r,i)=>({...r,i})).sort((a,b)=>a.price-b.price).slice(0,5).sort((a,b)=>new Date(a.datetime)-new Date(b.datetime))
        ,[rows]);

        const expensiveHours = useMemo(()=> !rows?.length?[]:
          [...rows].map((r,i)=>({...r,i})).sort((a,b)=>b.price-a.price).slice(0,5).sort((a,b)=>new Date(a.datetime)-new Date(b.datetime))
        ,[rows]);

        const costByHour = useMemo(()=>{
          const kwhPrice=rows.map(r=>r.price/1000);
          const totalW=hourlyProfile.reduce((a,b)=>a+b,0)||1;
          const norm=hourlyProfile.map(w=>w/totalW);
          const hourlyKWh=norm.map(w=>w*dailyKWh);
          const costs=hourlyKWh.map((k,i)=> k*(kwhPrice[i]??0));
          return { hourlyKWh, costs, total: costs.reduce((a,b)=>a+b,0) };
        },[rows,hourlyProfile,dailyKWh]);

        const exportCSV=()=>{ const csv=toCSV(rows); const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}); saveAs(blob,`precios-luz-${date}.csv`); };

        return (
          <div className="mx-auto max-w-6xl p-4 md:p-6 lg:p-8">
            <header className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-6">
              <div>
                <h1 className="text-2xl md:text-3xl font-semibold tracking-tight">Monitor de Precios de la Luz (España)</h1>
                <p className="text-xs sm:text-sm opacity-70">Precios horarios, análisis y calculadora • Zona horaria: {TZ}</p>
              </div>
              <div className="flex items-center gap-2 w-full sm:w-auto">
                <button onClick={()=>document.documentElement.classList.toggle('dark')} className="flex-1 sm:flex-none inline-flex items-center justify-center gap-2 rounded-2xl border px-3 py-2 text-sm shadow-sm hover:shadow transition">
                  <span>🌓</span> Modo oscuro
                </button>
                <button onClick={exportCSV} className="flex-1 sm:flex-none rounded-2xl border px-3 py-2 text-sm shadow-sm hover:shadow transition">Descargar CSV</button>
              </div>
            </header>

            <section className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
              <div className="rounded-2xl border p-4">
                <label className="text-xs uppercase tracking-wide opacity-70">Fecha</label>
                <input type="date" value={date} onChange={(e)=>setDate(e.target.value)} className="mt-1 w-full rounded-xl border px-3 py-2 bg-transparent" />
                <p className="text-xs mt-2 opacity-70">Cambia el día para ver el perfil de 24 horas.</p>
              </div>

              <div className="rounded-2xl border p-4">
                <label className="text-xs uppercase tracking-wide opacity-70">Fuente de datos</label>
                <select value={mode} onChange={(e)=>setMode(e.target.value)} className="mt-1 w-full rounded-xl border px-3 py-2 bg-transparent">
                  <option value="demo">DEMO (sin API)</option>
                  <option value="custom">URL personalizada (JSON)</option>
                  <option value="esios">ESIOS / Red Eléctrica (token)</option>
                </select>
                {mode==="custom" && (
                  <div className="mt-3">
                    <input placeholder='Pega una URL que devuelva [{ datetime, price }]' value={customURL} onChange={(e)=>setCustomURL(e.target.value)} className="w-full rounded-xl border px-3 py-2 bg-transparent" />
                    <p className="text-xs mt-2 opacity-70">Ej.: {`{ datetime: "2025-09-27T00:00:00Z", price: 65.3 }`}</p>
                  </div>
                )}
                {mode==="esios" && (
                  <div className="mt-3 grid grid-cols-1 gap-2">
                    <input placeholder="Token ESIOS" value={esiosToken} onChange={(e)=>setEsiosToken(e.target.value)} className="w-full rounded-xl border px-3 py-2 bg-transparent" />
                    <input placeholder="Dataset (p. ej. 600)" value={esiosDataset} onChange={(e)=>setEsiosDataset(e.target.value)} className="w-full rounded-xl border px-3 py-2 bg-transparent" />
                    <input placeholder="Geo IDs separados por coma (p. ej. 8741)" value={esiosGeo} onChange={(e)=>setEsiosGeo(e.target.value)} className="w-full rounded-xl border px-3 py-2 bg-transparent" />
                    <p className="text-xs opacity-70">Revisa la documentación de ESIOS para el indicador y zona.</p>
                  </div>
                )}
              </div>

              <div className="rounded-2xl border p-4">
                <label className="text-xs uppercase tracking-wide opacity-70">Consumo diario estimado</label>
                <div className="mt-1 flex items-center gap-2">
                  <input type="range" min="1" max="30" step="0.5" value={dailyKWh} onChange={(e)=>setDailyKWh(parseFloat(e.target.value))} className="flex-1" />
                  <div className="w-24 text-right tabular-nums">{dailyKWh.toFixed(1)} kWh</div>
                </div>
                <p className="text-xs mt-2 opacity-70">Ajusta para estimar el coste diario con el perfil horario.</p>
              </div>
            </section>

            {error && <div className="mb-4 rounded-2xl border border-red-300 bg-red-50 dark:border-red-800 dark:bg-red-900/30 p-4 text-red-700 dark:text-red-200">⚠️ {error}</div>}

            <section className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
              <div className="rounded-2xl border p-4">
                <div className="text-sm opacity-70">Precio medio</div>
                <div className="mt-1 text-2xl font-semibold tabular-nums">{(stats?.avg ?? NaN).toFixed ? stats.avg.toFixed(1) : "–"} €/MWh</div>
                <div className="text-xs opacity-70">{(stats?.avg ?? NaN).toFixed ? (stats.avg/1000).toFixed(5) : "–"} €/kWh</div>
              </div>
              <div className="rounded-2xl border p-4">
                <div className="text-sm opacity-70">Mínimo</div>
                <div className="mt-1 text-2xl font-semibold tabular-nums">{(stats?.min ?? NaN).toFixed ? stats.min.toFixed(1) : "–"} €/MWh</div>
                {stats && rows[stats.iMin] && <div className="text-xs opacity-70">a las {fmtHour(new Date(rows[stats.iMin].datetime))}</div>}
              </div>
              <div className="rounded-2xl border p-4">
                <div className="text-sm opacity-70">Máximo</div>
                <div className="mt-1 text-2xl font-semibold tabular-nums">{(stats?.max ?? NaN).toFixed ? stats.max.toFixed(1) : "–"} €/MWh</div>
                {stats && rows[stats.iMax] && <div className="text-xs opacity-70">a las {fmtHour(new Date(rows[stats.iMax].datetime))}</div>}
              </div>
            </section>

            <section className="rounded-2xl border p-4 mb-6">
              <div className="flex items-center justify-between mb-4">
                <h2 className="text-lg font-medium">Precios horarios ({date})</h2>
                {loading && <div className="text-sm opacity-70">Cargando…</div>}
              </div>
              <div className="h-64 md:h-80">
                <ResponsiveContainer width="100%" height="100%">
                  <LineChart data={rows} margin={{ left: 8, right: 8, top: 8, bottom: 8 }}>
                    <XAxis dataKey={(d)=> new Date(d.datetime).toLocaleTimeString("es-ES",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false})} tick={{ fontSize: 12 }} />
                    <YAxis domain={["auto","auto"]} tick={{ fontSize: 12 }} tickFormatter={(v)=>`${v}€`} />
                    <Tooltip content={<PriceTooltip />} />
                    <Line type="monotone" dataKey="price" dot={false} strokeWidth={2} />
                    {nowIdx >= 0 && rows[nowIdx] && <ReferenceArea x1={rows[nowIdx]?.datetime} x2={rows[nowIdx]?.datetime} />}
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </section>

            <section className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
              <div className="rounded-2xl border p-4">
                <h3 className="font-medium mb-2">Horas más baratas</h3>
                <ul className="space-y-1 text-sm">
                  {cheapHours.map((r, idx)=>(
                    <li key={`cheap-${idx}`} className="flex items-center justify-between">
                      <span className="opacity-80">{fmtHour(new Date(r.datetime))}</span>
                      <span className="tabular-nums font-medium">{r.price.toFixed(1)} €/MWh</span>
                    </li>
                  ))}
                </ul>
              </div>
              <div className="rounded-2xl border p-4">
                <h3 className="font-medium mb-2">Horas más caras</h3>
                <ul className="space-y-1 text-sm">
                  {expensiveHours.map((r, idx)=>(
                    <li key={`exp-${idx}`} className="flex items-center justify-between">
                      <span className="opacity-80">{fmtHour(new Date(r.datetime))}</span>
                      <span className="tabular-nums font-medium">{r.price.toFixed(1)} €/MWh</span>
                    </li>
                  ))}
                </ul>
              </div>
            </section>

            <section className="rounded-2xl border p-4 mb-10">
              <h3 className="font-medium mb-4">Calculadora de coste diario</h3>
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2">
                  <div className="text-sm opacity-70 mb-2">Perfil horario (reparte tu consumo en 24h). La suma debe ser 1.0</div>
                  <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-2">
                    {Array.from({length:24}).map((_,i)=> null)}
                  </div>
                </div>
                <div className="lg:col-span-1">
                  <div className="rounded-xl border p-4">
                    <div className="text-sm opacity-70">Coste total estimado hoy</div>
                    <div className="mt-1 text-3xl font-semibold tabular-nums">{/* se rellena más arriba */}</div>
                    <div className="text-xs opacity-70">{/* se rellena más arriba */}</div>
                  </div>
                </div>
              </div>
            </section>

            <footer className="pb-10 text-xs opacity-70">
              <p>✨ Usa la URL personalizada con tu backend normalizando a {"{ datetime, price }"}. Para ESIOS, elige el indicador y zona.</p>
              <p className="mt-2">Hecho con React + Tailwind + Recharts. Responsive y listo para móvil.</p>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
