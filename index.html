 <!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Monitor de Precios de la Luz (España)</title>
  <meta name="color-scheme" content="light dark"/>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
    header { margin-bottom: 1rem; }
    .card { border: 1px solid #ccc; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    .dark body { background: #111; color: #eee; }
    canvas { max-width: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>Monitor de Precios de la Luz (España)</h1>
    <p>Ejemplo DEMO, datos ficticios generados</p>
    <button id="darkBtn">🌓 Modo oscuro</button>
  </header>

  <div class="card">
    <label>Consumo diario estimado: <span id="kwhLabel">5</span> kWh</label><br>
    <input type="range" id="kwhSlider" min="1" max="30" step="0.5" value="5">
  </div>

  <div class="card">
    <h2>Precios horarios</h2>
    <canvas id="chart" height="200"></canvas>
  </div>

  <div class="card">
    <h2>Resumen</h2>
    <p>Precio medio: <span id="avg"></span> €/MWh</p>
    <p>Mínimo: <span id="min"></span> €/MWh</p>
    <p>Máximo: <span id="max"></span> €/MWh</p>
    <p>Coste diario estimado: <span id="cost"></span> €</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Generador DEMO de datos horarios
    function generarDatos() {
      const datos = [];
      const base = 70;
      for (let h = 0; h < 24; h++) {
        const variacion = 20 * Math.sin(((h - 7) / 24) * Math.PI * 2);
        const ruido = (Math.random() - 0.5) * 6;
        const precio = Math.max(10, Math.round((base + variacion + ruido) * 10) / 10);
        datos.push({ hora: h, precio });
      }
      return datos;
    }

    let datos = generarDatos();
    let consumoDiario = 5;

    // Calcular métricas
    function calcularResumen() {
      const precios = datos.map(d => d.precio);
      const avg = (precios.reduce((a,b) => a+b,0)/precios.length).toFixed(1);
      const min = Math.min(...precios).toFixed(1);
      const max = Math.max(...precios).toFixed(1);
      const coste = (consumoDiario * (avg/1000)).toFixed(2);

      document.getElementById("avg").textContent = avg;
      document.getElementById("min").textContent = min;
      document.getElementById("max").textContent = max;
      document.getElementById("cost").textContent = coste;
    }

    // Gráfico con Chart.js
    const ctx = document.getElementById("chart").getContext("2d");
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: datos.map(d => d.hora + ":00"),
        datasets: [{
          label: "€/MWh",
          data: datos.map(d => d.precio),
          borderWidth: 2,
          fill: false,
          tension: 0.2
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } }
      }
    });

    // Slider consumo
    document.getElementById("kwhSlider").addEventListener("input", (e)=>{
      consumoDiario = parseFloat(e.target.value);
      document.getElementById("kwhLabel").textContent = consumoDiario;
      calcularResumen();
    });

    // Botón modo oscuro
    document.getElementById("darkBtn").addEventListener("click", ()=>{
      document.documentElement.classList.toggle("dark");
    });

    calcularResumen();
  </script>
</body>
</html>
